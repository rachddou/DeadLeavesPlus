[project]
name = "deadleavesplus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blurgenerator>=1.1.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "kagglehub>=1.0.1",
    "kornia>=0.8.2",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "numba>=0.65.1",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "rasterio>=1.5.0",
    "scikit-image>=0.26.0",
    "shapely>=2.1.2",
    "tensorboardx>=2.6.5",
    "torch-fidelity>=0.4.0",
    "torcheval>=0.0.7",
    "torchmetrics>=1.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scipy>=1.10.0",
    "pillow>=9.0.0",
    "deepinv>=0.4.0",
    "nvidia-nccl-cu12",
    "nvidia-cudnn-cu12",
    "wandb>=0.27.0",
]

[tool.uv]
override-dependencies = [
    "antlr4-python3-runtime==4.9.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
